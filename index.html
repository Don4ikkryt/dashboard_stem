<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Дашборд освітніх просторів</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="loading-overlay">
  <div style="text-align:center">
    <div class="loading-spinner"></div>
    <div class="loading-text">Завантаження даних...</div>
  </div>
</div>

<div id="app">
  <!-- ── Sidebar / Drawer ─────────────────────────────────────────────── -->
  <aside id="sidebar">
    <!-- Mobile drawer handle -->
    <div id="drawer-handle" aria-label="Відкрити фільтри">
      <div class="drawer-knob"></div>
    </div>

    <!-- Header -->
    <div class="sidebar-header">
      <div class="sidebar-logo">STEM / НУШ</div>
      <div class="sidebar-title">Освітні простори України</div>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <!-- Name search -->
      <div class="filter-group">
        <div class="filter-label">Назва закладу</div>
        <input
          id="filter-name"
          class="name-search"
          type="text"
          placeholder="Пошук за назвою..."
          autocomplete="off"
        />
      </div>

      <!-- Oblast -->
      <div class="filter-group">
        <div class="filter-label">Область</div>
        <div id="filter-oblast" class="multi-select"></div>
      </div>

      <!-- Hromada -->
      <div class="filter-group">
        <div class="filter-label">Громада</div>
        <div id="filter-hromada" class="multi-select"></div>
      </div>

      <!-- Space type -->
      <div class="filter-group">
        <div class="filter-label">Тип простору</div>
        <div id="filter-type" class="multi-select"></div>
      </div>

      <!-- Format -->
      <div class="filter-group">
        <div class="filter-label">Формат роботи</div>
        <div id="filter-format" class="multi-select"></div>
      </div>
    </div>

    <!-- Legend -->
    <div class="legend-section">
      <div class="legend-title">Тип простору</div>
      <div id="legend-types"></div>

      <div class="legend-title">Ризик громади</div>
      <div id="legend-risk"></div>

      <div class="legend-title">Додаткові шари</div>
      <div class="legend-item">
        <span class="legend-rect" style="background:#A67B5B;opacity:0.5"></span>
        <span>Гірські райони</span>
      </div>
      <div class="legend-item">
        <span class="legend-rect" style="background:#C8C8C8"></span>
        <span>Зона Чорнобиля</span>
      </div>
      <div class="legend-item">
        <span class="legend-rect" style="background:#B0B0B0"></span>
        <span>ТОТ (тимчасово окупована)</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <span id="result-count">—</span>
      <button id="btn-reset">Скинути фільтри</button>
    </div>
  </aside>

  <!-- ── Map ─────────────────────────────────────────────────────────── -->
  <div id="map-container">
    <div id="map"></div>
  </div>
</div>

<script src="js/map-config.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/main.js"></script>
</body>
</html>
